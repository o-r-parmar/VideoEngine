<!doctype html>
<html lang="en">

    <style>
      @font-face {
        font-family: "Space Grotesk";
        font-weight: 400;
        src: url("assets/fonts/space-grotesk-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Space Grotesk";
        font-weight: 500;
        src: url("assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Space Grotesk";
        font-weight: 700;
        src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #070b12;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070b12;
        font-family: "Space Grotesk", Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .layer {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      .cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      svg.full {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: visible;
      }
      .h {
        opacity: 0;
      }

      /* ---- mid plane ---- */
      #mid {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      #beam {
        position: absolute;
        left: 580px;
        top: 180px;
        width: 760px;
        height: 760px;
        opacity: 0;
        background: conic-gradient(
          from 0deg at 50% 50%,
          rgba(34, 211, 238, 0) 0deg,
          rgba(34, 211, 238, 0) 332deg,
          rgba(34, 211, 238, 0.05) 340deg,
          rgba(34, 211, 238, 0.24) 357deg,
          rgba(34, 211, 238, 0.7) 359.5deg,
          rgba(34, 211, 238, 0) 360deg
        );
        -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0, #000 376px, transparent 380px);
        mask-image: radial-gradient(circle at 50% 50%, #000 0, #000 376px, transparent 380px);
      }
      .slot {
        position: absolute;
        width: 88px;
        height: 88px;
        opacity: 0;
      }
      .bob {
        position: absolute;
        left: 0;
        top: 0;
        width: 88px;
        height: 88px;
      }
      .icon {
        position: absolute;
        left: 0;
        top: 0;
        width: 88px;
        height: 88px;
        overflow: visible;
        fill: none;
        stroke: #e8eef5;
        stroke-width: 3;
        stroke-linejoin: round;
        stroke-linecap: butt;
      }
      .badgeWrap {
        position: absolute;
        left: 54px;
        top: -14px;
        width: 36px;
        height: 36px;
      }
      .badge {
        position: absolute;
        left: 0;
        top: 0;
        width: 36px;
        height: 36px;
        opacity: 0;
      }
      .badge svg {
        position: absolute;
        left: 0;
        top: 0;
        width: 36px;
        height: 36px;
        overflow: visible;
      }

      /* ---- near plane (HUD) ---- */
      .mono {
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }
      #camLabel {
        position: absolute;
        left: 104px;
        top: 84px;
        height: 24px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 18px;
        line-height: 24px;

        opacity: 0;

      #camDot {

        border-radius: 50%;

      }

        top: 972px;
        height: 24px;
        display: flex;
        align-items: center;
        font-size: 18px;
        line-height: 24px;
        color: #8b95a7;
        letter-spacing: 0.04em;
        white-space: pre;
        opacity: 0;
      }

      /* ---- text plane ---- */

        left: 0;

    <script>
      // ---------- seeded PRNG (the only source of randomness) ----------
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = mulberry32(0x5e601);

      const FPS = 60;
      const CX = 960;
      const CY = 560;
      const ORBIT = 320;
      const DUR = 60;
      const tl = gsap.timeline({ paused: true });

      // ---------- static setup (hidden / initial states) ----------
      gsap.set("#camA, #camB, #farCamA, #farCamB, #far", { transformOrigin: "960px 560px" });
      gsap.set("#mid", { transformOrigin: "960px 560px" });
      gsap.set("#blades", { svgOrigin: "960 560" });
      gsap.set("#blades", { rotation: -30 });
      gsap.set("#glint", { x: 0 });

      // ---------- char-by-char text ----------
      function buildChars(el, text, withCaret) {
        const chars = [];
        for (const c of text) {
          const s = document.createElement("span");
          s.className = "ch";
          s.textContent = c;
          if (withCaret) {
            const i = document.createElement("i");
            i.className = "caret";
            s.appendChild(i);
          }
          el.appendChild(s);
          chars.push(s);
        }
        return chars;
      }
      function typeOn(chars, t0, step, withCaret, blinkUntil) {
        chars.forEach((s, i) => {
          const t = t0 + i * step;
          tl.set(s, { opacity: 1 }, t);
          if (withCaret) {
            const caret = s.querySelector(".caret");
            tl.set(caret, { opacity: 1 }, t);
            if (i < chars.length - 1) tl.set(caret, { opacity: 0 }, t0 + (i + 1) * step);
          }
        });
        if (withCaret) {
          const last = chars[chars.length - 1].querySelector(".caret");
          const tEnd = t0 + (chars.length - 1) * step;
          let on = true;
          for (let t = tEnd + 0.5; t < blinkUntil; t += 0.5) {
            on = !on;
            tl.set(last, { opacity: on ? 1 : 0 }, t);
          }
          tl.set(last, { opacity: 0 }, blinkUntil);
        }
      }

      // ---------- CAMERA (far 0.2x, mid 1x) ----------
      const PUSH1_WIN = 46; // window slightly longer than 44s so the push never decays
      const push1 = 0.04 * (PUSH1_WIN / 44);
      tl.to("#camA", { scale: 1 + push1, duration: PUSH1_WIN, ease: "none" }, 0);
      tl.to("#farCamA", { scale: 1 + push1 * 0.2, duration: PUSH1_WIN, ease: "none" }, 0);
      tl.to("#camB", { scale: 1.02, duration: 14, ease: "none" }, 46);
      tl.to("#farCamB", { scale: 1.004, duration: 14, ease: "none" }, 46);

      // far rings fade in from 5s
      tl.to("#rings", { opacity: 1, duration: 3, ease: "power1.out" }, 5);

      // ---------- B1: the dot ----------
      tl.to("#pupil", { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.4);
      tl.to("#glow", { opacity: 0.6, duration: 0.5, ease: "power1.out" }, 0.4);
      [1.3, 2.7].forEach((t) => {
        tl.to("#pupil", { scale: 1.4, duration: 0.3, ease: "back.out(1.7)" }, t);
        tl.to("#pupil", { scale: 1, duration: 0.3, ease: "power2.inOut" }, t + 0.3);
        tl.to("#glow", { scale: 1.3, duration: 0.3, ease: "back.out(1.7)" }, t);
        tl.to("#glow", { scale: 1, duration: 0.3, ease: "power2.inOut" }, t + 0.3);
      });
      // faint 1s glow heartbeat, whole segment (skips the pulse windows' glow scale only; it drives opacity)
      for (let t = 0.9, hi = true; t < DUR; t += 0.5, hi = !hi) {
        tl.to("#glow", { opacity: hi ? 0.85 : 0.45, duration: 0.5, ease: "sine.inOut" }, t);
      }

      // ---------- B2: the eye ----------
      tl.to("#iris", { attr: { "stroke-dashoffset": 0 }, duration: 1.0, ease: "power2.inOut" }, 5.0);
      tl.to("#lidUp", { attr: { "stroke-dashoffset": 0 }, duration: 1.2, ease: "power2.inOut" }, 6.2);
      tl.to("#lidDn", { attr: { "stroke-dashoffset": 0 }, duration: 1.2, ease: "power2.inOut" }, 6.35);
      tl.to("#blades", { rotation: 0, opacity: 1, duration: 0.8, ease: "power2.out" }, 7.6);
      tl.to("#glint", { opacity: 1, duration: 0.1, ease: "none" }, 7.6);
      tl.to("#glint", { x: 190, duration: 0.8, ease: "power1.inOut" }, 7.6);
      tl.to("#glint", { opacity: 0, duration: 0.15, ease: "none" }, 8.25);

      // ---------- persistent chrome ----------
      tl.to(".brk", { attr: { "stroke-dashoffset": 0 }, duration: 0.7, ease: "power2.out", stagger: 0.08 }, 8.2);
      tl.to("#camLabel", { opacity: 1, duration: 0.4, ease: "power1.out" }, 8.2);
      tl.to("#frmLabel", { opacity: 1, duration: 0.4, ease: "power1.out" }, 8.2);
      for (let t = 8.6, hi = false; t < DUR; t += 0.5, hi = !hi) {
        tl.to("#camDot", { opacity: hi ? 1 : 0.3, duration: 0.5, ease: "sine.inOut" }, t);
      }
      // frame counter: integer frame index (Math.round(t*30)), stepped
      const frm = document.getElementById("frmLabel");
      for (let k = 0; k <= DUR * 30; k++) {
        tl.set(frm, { textContent: "FRM " + String(Math.round((k / 30) * 30)).padStart(6, "0") }, k / 30);
      }

      // ---------- saccades (stepped on integer frames) ----------
      function saccades(f0, f1) {
        let f = f0;
        while (f < f1) {
          const dx = Math.round((rnd() * 2 - 1) * 4);
          const dy = Math.round((rnd() * 2 - 1) * 4);
          tl.set("#sacc", { x: dx, y: dy }, f / FPS);
          f += 6 * (1 + Math.floor(rnd() * 3));
        }
      }
      saccades(Math.round(8.6 * FPS), Math.round(10 * FPS));
      tl.set("#sacc", { x: 0, y: 0 }, 10);

      // ---------- B3: orbit arrivals ----------
      const arrivals = [10.4, 12.4, 14.4, 16.4, 18.4, 20.4];
      const slots = [];
      for (let i = 0; i < 6; i++) {
        const el = document.getElementById("slot" + i);
        const ang = (parseFloat(el.dataset.ang) * Math.PI) / 180;
        const sx = CX + ORBIT * Math.sin(ang);
        const sy = CY - ORBIT * Math.cos(ang);
        el.style.left = sx - 44 + "px";
        el.style.top = sy - 44 + "px";
        // nearest frame edge
        const d = { l: sx, r: 1920 - sx, t: sy, b: 1080 - sy };
        const edge = Object.keys(d).reduce((a, b) => (d[a] <= d[b] ? a : b));
        let px = sx;
        let py = sy;
        if (edge === "l") px = -80;
        if (edge === "r") px = 2000;
        if (edge === "t") py = -80;
        if (edge === "b") py = 1160;
        gsap.set(el, { x: px - sx, y: py - sy });
        slots.push({ el, ang, sx, sy, svg: el.querySelector(".icon") });
      }

      slots.forEach((s, i) => {
        const t0 = arrivals[i];
        tl.to(s.el, { x: 0, y: 0, duration: 0.9, ease: "back.out(1.7)" }, t0);
        tl.to(s.el, { opacity: 1, duration: 0.15, ease: "none" }, t0);
        // motivated glance, 10px toward the new icon
        tl.to("#glance", { x: 10 * Math.sin(s.ang), y: -10 * Math.cos(s.ang), duration: 0.3, ease: "power2.out" }, t0 + 0.9);
      });
      tl.to("#glance", { x: 0, y: 0, duration: 0.3, ease: "power2.inOut" }, 22.0);
      saccades(Math.round(22.3 * FPS), DUR * FPS);

      // bobs: seeded, phase-offset, bounded at +/-3px, per icon
      slots.forEach((s, i) => {
        const bob = s.el.querySelector(".bob");
        let t = arrivals[i] + 0.9 + rnd() * 1.2;
        let sign = rnd() < 0.5 ? -1 : 1;
        while (t < DUR) {
          const dur = 1.4 + rnd() * 0.9;
          const amp = 1.8 + rnd() * 1.2;
          const d = Math.min(dur, DUR - t);
          tl.to(bob, { y: sign * amp, duration: d, ease: "sine.inOut" }, t);
          sign = -sign;
          t += dur;
        }
      });

      // ---------- B4: the scan ----------
      tl.to("#beam", { opacity: 1, duration: 0.4, ease: "power1.out" }, 24);
      tl.to("#beam", { rotation: 360, duration: 12, ease: "none" }, 24);
      tl.to("#beam", { rotation: 720, duration: 24, ease: "none" }, 36);
      tl.to("#beam", { opacity: 0.15, duration: 0.8, ease: "power1.out" }, 36);

      slots.forEach((s, i) => {
        const tc = 25 + 2 * i; // leading edge crosses slot angle (30*(t-24) = ang)
        const badge = s.el.querySelector(".badge");
        const tick = s.el.querySelector(".badge path");
        gsap.set(badge, { scale: 0.6 });
        tl.to(s.svg, { stroke: "#22D3EE", duration: 0.1, ease: "none" }, tc);
        tl.to(s.svg, { stroke: "#E8EEF5", duration: 0.1, ease: "none" }, tc + 0.1);
        tl.to(badge, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.7)" }, tc);
        tl.to(tick, { attr: { "stroke-dashoffset": 0 }, duration: 0.25, ease: "power2.out" }, tc + 0.06);
      });

      // spectacle beat: the one exaggeration (sixth check at 35.0s)
      tl.to(".badgeWrap", { scale: 1.25, duration: 1 / FPS, ease: "none" }, 35.0);
      tl.to(".badgeWrap", { scale: 1, duration: 0.3, ease: "power2.out" }, 35.0 + 3 / FPS);
      tl.set("#shock", { opacity: 0.9 }, 35.0);
      tl.to("#shock", { attr: { r: 520 }, duration: 0.8, ease: "power2.out" }, 35.0);
      tl.to("#shock", { opacity: 0, duration: 0.8, ease: "power1.in" }, 35.0);

      // ---------- B5: the line ----------
      const lineChars = buildChars(document.getElementById("line"), "Every one of these was checked by a camera.", true);
      typeOn(lineChars, 36.2, 1 / 22, true, 41.2);
      tl.to("#line", { opacity: 0, duration: 0.6, ease: "power2.in" }, 41.2);

      // ---------- B6: title lockup ----------
      tl.to("#mid", { scale: 0.52, y: -260, duration: 1.4, ease: "power3.inOut" }, 44.0);
      tl.to("#far", { scale: 0.904, y: -52, duration: 1.4, ease: "power3.inOut" }, 44.0);
      const eyebrowChars = buildChars(document.getElementById("eyebrow"), "EPISODE 001", false);
      typeOn(eyebrowChars, 45.2, 0.07, false, 0);
      gsap.set("#title .w", { y: 40 });
      tl.to("#title .w", { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.08 }, 45.9);

      // ---------- B7: sign-off ----------
      gsap.set("#subtitle, #name", { y: 12 });
      tl.to("#subtitle", { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 52.0);
      tl.to("#name", { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 53.0);

      // ---------- wipe to clean ground ----------
      tl.set("#wipeLine", { opacity: 1 }, 59.2);
      tl.to("#wipePanel", { clipPath: "inset(0px 0px 0px 0px)", duration: 0.8, ease: "power2.inOut" }, 59.2);
      tl.to("#wipeLine", { x: 1920, duration: 0.8, ease: "power2.inOut" }, 59.2);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
